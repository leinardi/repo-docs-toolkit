version: 2

# pip and pre-commit share one pull request. pytest is pinned in requirements-dev.txt and again in
# the mypy hooks' additional_dependencies, and each ecosystem bumps only its own copy; as two
# pull requests, merging one leaves mypy type-checking the tests against a different pytest than
# the one CI runs.
multi-ecosystem-groups:
  dev-tools:
    schedule:
      interval: "monthly"
    # requirements-dev.txt and the hook revs never ship: the plugin itself has no runtime
    # dependencies, so a bump here stays chore(deps).
    commit-message:
      prefix: "chore(deps)"

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Wait a week after a release before proposing it (GitHub's default is
    # 3 days), so a broken or compromised release has time to be yanked.
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    multi-ecosystem-group: "dev-tools"
    patterns: ["*"]
    # Labels on the group are not applied: the first dev-tools pull request got Dependabot's
    # default labels instead. Set on each entry, as on the ungrouped ones.
    labels: ["dependencies", "ci"]
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/"
    multi-ecosystem-group: "dev-tools"
    patterns: ["*"]
    labels: ["dependencies", "ci"]
    cooldown:
      default-days: 7

  # requirements/a11y.txt: Playwright for the landing page accessibility tests (dev-only).
  - package-ecosystem: "pip"
    directory: "/requirements"
    multi-ecosystem-group: "dev-tools"
    patterns: ["*"]
    labels: ["dependencies", "ci"]
    cooldown:
      default-days: 7

  # tools/docs/uv.lock: the Zensical that builds the site and runs the zensical, landing and a11y
  # tests. Its own pull request, outside dev-tools: the skills' Zensical claims and KNOWN_ZENSICAL in
  # docstool.py were checked against the pinned version, so merging a bump means re-checking them
  # (skills/zensical-site/references/upgrade-and-audit.md).
  - package-ecosystem: "uv"
    directory: "/tools/docs"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(deps)"
