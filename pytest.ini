[pytest]
testpaths = tests
addopts = -ra --strict-markers --strict-config
markers =
    zensical: needs the pinned Zensical (zensical-requirements.txt); CI sets DOCSTOOL_REQUIRE_ZENSICAL=1 so it fails instead of skipping
    a11y: needs the pinned Zensical and Playwright (requirements/a11y.txt); CI sets DOCSTOOL_REQUIRE_A11Y=1 so it fails instead of skipping
